
name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Source and Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Juice Shop source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          ref: v20.3.0
          path: juice-shop

      - name: Scan source for misconfigurations and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-source.json
          exit-code: '0'

      
      - name: Apply Handlebars security override
        working-directory: juice-shop
        run: |
          set -eu

          if [ -f package-lock.json ]; then
            echo "A package-lock.json exists. Review lockfile handling before applying the override."
            exit 1
          fi

          npm pkg set 'overrides.handlebars=4.7.10'

          echo "Configured npm override:"
          node -e "console.log(JSON.stringify(require('./package.json').overrides, null, 2))"

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:ci ./juice-shop


      - name: Smoke test Juice Shop container
        run: |
          set -eu

          docker run -d \
            --name juice-shop-smoke \
            -p 127.0.0.1:3000:3000 \
            juice-shop:ci

          cleanup() {
            docker rm -f juice-shop-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for Juice Shop to become available..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "PASS: Juice Shop HTTP endpoint responded successfully."
              exit 0
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "FAIL: Juice Shop did not become ready."
              docker logs juice-shop-smoke
              exit 1
            fi

            sleep 2
          done



     
      - name: Inspect Juice Shop image filesystem
        continue-on-error: true
        run: |
          set -eu

          container_id=$(docker create juice-shop:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          mkdir -p image-rootfs
          docker export "$container_id" | tar -xf - -C image-rootfs

          echo "Checking package manifests and installed dependency locations:"
          find image-rootfs -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name yarn.lock -o \
            -name pnpm-lock.yaml \
          \) -print > dependency-tree.json

          cat dependency-tree.json



      
      
      - name: Find crypto-js parent dependencies
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")
          targets = {"crypto-js"}

          print("Packages declaring crypto-js:")
          found = 0

          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(manifest.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              for section in (
                  "dependencies",
                  "optionalDependencies",
                  "devDependencies",
                  "peerDependencies",
              ):
                  deps = data.get(section, {})
                  if not isinstance(deps, dict):
                      continue

                  for name in sorted(targets.intersection(deps)):
                      found += 1
                      print(
                          f"{data.get('name', manifest.parent.name)}"
                          f"@{data.get('version', 'unknown')} "
                          f"declares {name}@{deps[name]} "
                          f"({section})"
                      )

          if not found:
              print("No installed package manifest directly declares crypto-js.")
          PY



      - name: Inspect PDFKit and crypto-js dependency versions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")

          for relative in (
              "pdfkit/package.json",
              "crypto-js/package.json",
          ):
              path = root / relative
              print(f"\n--- {relative} ---")

              if not path.exists():
                  print("Not found")
                  continue

              data = json.loads(path.read_text(encoding="utf-8"))
              print("Name:", data.get("name"))
              print("Version:", data.get("version"))
              print(
                  "crypto-js requirement:",
                  data.get("dependencies", {}).get(
                      "crypto-js", "not declared"
                  )
              )

          print("\nAll installed packages declaring crypto-js:")
          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(
                      manifest.read_text(encoding="utf-8")
                  )
              except (OSError, json.JSONDecodeError):
                  continue

              requirement = data.get("dependencies", {}).get("crypto-js")
              if requirement:
                  print(
                      f"{data.get('name', manifest.parent.name)}"
                      f"@{data.get('version', 'unknown')}: {requirement}"
                  )
          PY



      - name: Inspect parent dependency declarations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")
          targets = {
              "crypto-js", "handlebars", "jsonwebtoken",
              "lodash", "tar", "moment"
          }

          print("Parent dependency declarations:")
          for package_file in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(package_file.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              declared = {}
              for section in ("dependencies", "optionalDependencies",
                              "devDependencies", "peerDependencies"):
                  deps = data.get(section, {})
                  if isinstance(deps, dict):
                      for name in targets.intersection(deps):
                          declared[name] = deps[name]

              if declared:
                  parent = data.get("name", str(package_file.parent))
                  print(f"{parent} ({data.get('version', 'unknown')}): {declared}")
          PY



      - name: Inspect Handlebars dependency configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "image-rootfs/juice-shop/node_modules/hbs/package.json",
              "image-rootfs/juice-shop/node_modules/handlebars/package.json",
              "image-rootfs/juice-shop/package.json",
          ]

          sections = [
              "name",
              "version",
              "dependencies",
              "devDependencies",
              "overrides",
              "scripts",
          ]

          for filename in files:
              path = Path(filename)
              print(f"\n{'=' * 65}")
              print(f"FILE: {filename}")
              print("=" * 65)

              if not path.exists():
                  print("FILE NOT FOUND")
                  continue

              data = json.loads(path.read_text(encoding="utf-8"))

              for section in sections:
                  if section in data:
                      print(f"\n{section}:")
                      print(json.dumps(data[section], indent=2))
          PY



      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop:ci
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '0'



      - name: Summarize vulnerable package instances
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("trivy-image.json")
          if not report.exists():
              print("ERROR: trivy-image.json not found")
              raise SystemExit(1)

          data = json.loads(report.read_text(encoding="utf-8"))
          targets = {
              "crypto-js", "handlebars", "jsonwebtoken",
              "lodash", "tar", "moment"
          }

          print("Vulnerable package instances:")
          count = 0

          for result in data.get("Results", []):
              for item in result.get("Vulnerabilities") or []:
                  if item.get("PkgName") in targets:
                      print(
                          f"{item.get('Severity', 'UNKNOWN'):8} "
                          f"{item.get('VulnerabilityID', 'N/A'):20} "
                          f"{item.get('PkgName', 'N/A'):15} "
                          f"{item.get('InstalledVersion', 'N/A'):12} "
                          f"fixed={item.get('FixedVersion') or 'not specified'}"
                      )
                      count += 1

          print(f"\nTotal matching vulnerability records: {count}")
          PY


      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-source.json
            trivy-image.json
            dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
