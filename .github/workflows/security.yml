
name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Juice Shop Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Juice Shop source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: juice-shop

      - name: Scan Juice Shop source code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
