
name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Source and Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Juice Shop source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          ref: v20.3.0
          path: juice-shop

      - name: Scan source for misconfigurations and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-source.json
          exit-code: '0'

      
     
      - name: Apply dependency security overrides
        working-directory: juice-shop
        run: |
          set -eu

          if [ -f package-lock.json ]; then
            echo "Unexpected package-lock.json; review before proceeding."
            exit 1
          fi

          npm pkg set 'overrides.handlebars=4.7.10'
          npm pkg set 'overrides.crypto-js=4.2.0'
          npm pkg set 'dependencies.jsonwebtoken=9.0.0'

          echo "Configured overrides:"
          node -e "console.log(JSON.stringify(require('./package.json').overrides, null, 2))"



      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:ci ./juice-shop


      - name: Smoke test Juice Shop container
        run: |
          set -eu

          docker run -d \
            --name juice-shop-smoke \
            -p 127.0.0.1:3000:3000 \
            juice-shop:ci

          cleanup() {
            docker rm -f juice-shop-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for Juice Shop to become available..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "PASS: Juice Shop HTTP endpoint responded successfully."
              exit 0
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "FAIL: Juice Shop did not become ready."
              docker logs juice-shop-smoke
              exit 1
            fi

            sleep 2
          done


      
     
      - name: Test authentication and JWT signing
        run: |
          set -eu

          docker run -d \
            --name juice-shop-auth-test \
            -p 127.0.0.1:3001:3000 \
            juice-shop:ci

          cleanup() {
            docker rm -f juice-shop-auth-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for Juice Shop..."
          ready=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3001/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "FAIL: Juice Shop did not become ready."
            docker logs juice-shop-auth-test
            exit 1
          fi

          echo "Checking login endpoint..."
          status=$(curl -sS -o /tmp/login-response.json \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"email":"invalid-test-user@example.invalid","password":"invalid-test-password"}' \
            http://127.0.0.1:3001/rest/user/login)

          echo "Login HTTP status: $status"

          if [ "$status" = "500" ]; then
            cat /tmp/login-response.json
            docker logs juice-shop-auth-test
            echo "FAIL: Login endpoint returned an internal server error."
            exit 1
          fi

          echo "Checking root JWT signing and verification..."

          docker exec juice-shop-auth-test sh -c '
            NODE_BIN=$(find / -type f -name node -executable 2>/dev/null | head -n 1)

            if [ -z "$NODE_BIN" ]; then
              echo "FAIL: Node.js executable not found in container."
              exit 1
            fi

            export NODE_PATH=/juice-shop/node_modules
            "$NODE_BIN" -e "
              const jwt = require(\"/juice-shop/node_modules/jsonwebtoken\");
              const token = jwt.sign({sub:\"ci-test\"}, \"ci-test-secret\");
              const decoded = jwt.verify(token, \"ci-test-secret\");

              if (decoded.sub !== \"ci-test\") {
                console.error(\"FAIL: JWT verification returned unexpected data.\");
                process.exit(1);
              }

              console.log(\"PASS: JWT signing and verification work.\");
            "
          '

          echo "PASS: Authentication compatibility checks completed."



     
      - name: Inspect Juice Shop image filesystem
        continue-on-error: true
        run: |
          set -eu

          container_id=$(docker create juice-shop:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          mkdir -p image-rootfs
          docker export "$container_id" | tar -xf - -C image-rootfs

          echo "Checking package manifests and installed dependency locations:"
          find image-rootfs -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name yarn.lock -o \
            -name pnpm-lock.yaml \
          \) -print > dependency-tree.json

          cat dependency-tree.json



      - name: Find crypto-js parent dependencies
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")
          targets = {"crypto-js"}

          print("Packages declaring crypto-js:")
          found = 0

          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(manifest.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              for section in (
                  "dependencies",
                  "optionalDependencies",
                  "devDependencies",
                  "peerDependencies",
              ):
                  deps = data.get(section, {})
                  if not isinstance(deps, dict):
                      continue

                  for name in sorted(targets.intersection(deps)):
                      found += 1
                      print(
                          f"{data.get('name', manifest.parent.name)}"
                          f"@{data.get('version', 'unknown')} "
                          f"declares {name}@{deps[name]} "
                          f"({section})"
                      )

          if not found:
              print("No installed package manifest directly declares crypto-js.")
          PY



      - name: Inspect PDFKit and crypto-js dependency versions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")

          for relative in (
              "pdfkit/package.json",
              "crypto-js/package.json",
          ):
              path = root / relative
              print(f"\n--- {relative} ---")

              if not path.exists():
                  print("Not found")
                  continue

              data = json.loads(path.read_text(encoding="utf-8"))
              print("Name:", data.get("name"))
              print("Version:", data.get("version"))
              print(
                  "crypto-js requirement:",
                  data.get("dependencies", {}).get(
                      "crypto-js", "not declared"
                  )
              )

          print("\nAll installed packages declaring crypto-js:")
          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(
                      manifest.read_text(encoding="utf-8")
                  )
              except (OSError, json.JSONDecodeError):
                  continue

              requirement = data.get("dependencies", {}).get("crypto-js")
              if requirement:
                  print(
                      f"{data.get('name', manifest.parent.name)}"
                      f"@{data.get('version', 'unknown')}: {requirement}"
                  )
          PY


      - name: Inspect PDFKit dependency metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "image-rootfs/juice-shop/node_modules/pdfkit/package.json"
          )

          if not path.exists():
              raise SystemExit("PDFKit package.json not found")

          data = json.loads(path.read_text(encoding="utf-8"))

          print("PDFKit version:", data.get("version"))
          print("PDFKit dependencies:")
          print(json.dumps(data.get("dependencies", {}), indent=2))
          print("PDFKit peer dependencies:")
          print(json.dumps(data.get("peerDependencies", {}), indent=2))
          PY



      - name: Inspect parent dependency declarations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")
          targets = {
              "crypto-js", "handlebars", "jsonwebtoken",
              "lodash", "tar", "moment"
          }

          print("Parent dependency declarations:")
          for package_file in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(package_file.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              declared = {}
              for section in ("dependencies", "optionalDependencies",
                              "devDependencies", "peerDependencies"):
                  deps = data.get(section, {})
                  if isinstance(deps, dict):
                      for name in targets.intersection(deps):
                          declared[name] = deps[name]

              if declared:
                  parent = data.get("name", str(package_file.parent))
                  print(f"{parent} ({data.get('version', 'unknown')}): {declared}")
          PY



      - name: Trace jsonwebtoken parent dependencies
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")
          found = 0

          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(manifest.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              for section in (
                  "dependencies",
                  "optionalDependencies",
                  "devDependencies",
                  "peerDependencies",
              ):
                  deps = data.get(section, {})
                  if not isinstance(deps, dict):
                      continue

                  if "jsonwebtoken" in deps:
                      found += 1
                      print(
                          f"{data.get('name', manifest.parent.name)}"
                          f"@{data.get('version', 'unknown')} "
                          f"declares jsonwebtoken@{deps['jsonwebtoken']} "
                          f"({section})"
                      )

          if not found:
              print("No installed package manifests declare jsonwebtoken.")
          PY



      - name: Inspect express-jwt usage
        if: always()
        run: |
          echo "express-jwt package declaration:"
          grep -n -C 3 '"express-jwt"' juice-shop/package.json || true

          echo "Application references:"
          grep -R -n --include='*.js' --include='*.ts' \
            --exclude-dir=node_modules \
            --exclude-dir=frontend \
            'express-jwt\|expressJwt\|expressJWT' \
            juice-shop || true



      - name: Inspect authentication middleware implementation
        if: always()
        run: |
          echo "Authentication middleware:"
          sed -n '1,90p' juice-shop/lib/insecurity.ts

          echo "Express JWT package metadata:"
          node -e "
            const p = require('./image-rootfs/juice-shop/node_modules/express-jwt/package.json');
            console.log(JSON.stringify({
              name: p.name,
              version: p.version,
              dependencies: p.dependencies
            }, null, 2));
          "



      - name: Locate installed jsonwebtoken versions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")

          for manifest in sorted(root.rglob("package.json")):
              try:
                  data = json.loads(manifest.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue

              if data.get("name") != "jsonwebtoken":
                  continue

              print(f"\nPackage: {manifest}")
              print("Version:", data.get("version"))

              for parent in manifest.parents:
                  parent_manifest = parent / "package.json"
                  if not parent_manifest.exists():
                      continue

                  try:
                      parent_data = json.loads(
                          parent_manifest.read_text(encoding="utf-8")
                      )
                  except (OSError, json.JSONDecodeError):
                      continue

                  if parent_data.get("name") == "jsonwebtoken":
                      continue

                  declared = parent_data.get("dependencies", {}).get(
                      "jsonwebtoken"
                  )

                  if declared:
                      print(
                          "Parent:",
                          f"{parent_data.get('name')}@"
                          f"{parent_data.get('version')}"
                      )
                      print("Declared range:", declared)
                      break
          PY



      - name: Inspect express-jwt compatibility
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("image-rootfs/juice-shop/node_modules")

          targets = [
              "express-jwt/package.json",
              "express-jwt/node_modules/jsonwebtoken/package.json",
              "jsonwebtoken/package.json",
          ]

          for relative in targets:
              path = root / relative
              print(f"\n--- {relative} ---")

              if not path.exists():
                  print("Not found")
                  continue

              data = json.loads(path.read_text(encoding="utf-8"))
              print("Name:", data.get("name"))
              print("Version:", data.get("version"))
              print("Dependencies:", json.dumps(
                  data.get("dependencies", {}), indent=2
              ))
              print("Entry point:", data.get("main"))
          PY



      - name: Inspect declared authentication dependencies
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_file = Path("juice-shop/package.json")
          data = json.loads(package_file.read_text(encoding="utf-8"))

          for section in ("dependencies", "devDependencies", "overrides"):
              print(f"\n--- {section} ---")
              entries = data.get(section, {})
              for name in ("jsonwebtoken", "express-jwt", "jws", "moment"):
                  if name in entries:
                      print(f"{name}: {entries[name]}")
          PY


      - name: Inspect authentication API usage
        if: always()
        run: |
          grep -n -E 'expressJwt|express-jwt|jsonwebtoken|jwt\.sign|jwt\.verify|isAuthorized|denyAll|authorize' juice-shop/lib/insecurity.ts || true


      - name: Inspect root jsonwebtoken dependency
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("juice-shop/package.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print("Juice Shop version:", data.get("version"))
          print("Declared jsonwebtoken version:",
                data.get("dependencies", {}).get("jsonwebtoken"))
          print("Existing jsonwebtoken override:",
                data.get("overrides", {}).get("jsonwebtoken", "None"))
          PY


      - name: Inspect authentication dependency tree
        if: always()
        run: |
          cd juice-shop
          npm ls express-jwt jsonwebtoken jws moment --all || true


      - name: Inspect Handlebars dependency configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              "image-rootfs/juice-shop/node_modules/hbs/package.json",
              "image-rootfs/juice-shop/node_modules/handlebars/package.json",
              "image-rootfs/juice-shop/package.json",
          ]

          sections = [
              "name",
              "version",
              "dependencies",
              "devDependencies",
              "overrides",
              "scripts",
          ]

          for filename in files:
              path = Path(filename)
              print(f"\n{'=' * 65}")
              print(f"FILE: {filename}")
              print("=" * 65)

              if not path.exists():
                  print("FILE NOT FOUND")
                  continue

              data = json.loads(path.read_text(encoding="utf-8"))

              for section in sections:
                  if section in data:
                      print(f"\n{section}:")
                      print(json.dumps(data[section], indent=2))
          PY



      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop:ci
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '0'



      - name: Summarize vulnerable package instances
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("trivy-image.json")
          if not report.exists():
              print("ERROR: trivy-image.json not found")
              raise SystemExit(1)

          data = json.loads(report.read_text(encoding="utf-8"))
          targets = {
              "crypto-js", "handlebars", "jsonwebtoken",
              "lodash", "tar", "moment"
          }

          print("Vulnerable package instances:")
          count = 0

          for result in data.get("Results", []):
              for item in result.get("Vulnerabilities") or []:
                  if item.get("PkgName") in targets:
                      print(
                          f"{item.get('Severity', 'UNKNOWN'):8} "
                          f"{item.get('VulnerabilityID', 'N/A'):20} "
                          f"{item.get('PkgName', 'N/A'):15} "
                          f"{item.get('InstalledVersion', 'N/A'):12} "
                          f"fixed={item.get('FixedVersion') or 'not specified'}"
                      )
                      count += 1

          print(f"\nTotal matching vulnerability records: {count}")
          PY


      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-source.json
            trivy-image.json
            dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
