
name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Source and Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Juice Shop source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          ref: v20.3.0
          path: juice-shop

      - name: Scan source for misconfigurations and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-source.json
          exit-code: '0'

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:ci ./juice-shop

      
      
      - name: Inspect vulnerable dependency paths
        continue-on-error: true
        run: |
          docker run --rm \
            --entrypoint node \
            juice-shop:ci \
            -e "const fs=require('fs');const paths=['crypto-js','handlebars','jsonwebtoken','lodash','tar'];for(const p of paths {console.log('\nPACKAGE:',p);try{console.log(require.resolve(p+'/package.json'))}catch(e){try{console.log(require.resolve(p))}catch(e2){console.log('NOT RESOLVED:',e2.message)}}}" \
            > dependency-tree.json 2> dependency-tree-errors.txt || true

          echo "Inspection output:"
          cat dependency-tree.json
          echo "Inspection errors:"
          cat dependency-tree-errors.txt




      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop:ci
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '0'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-source.json
            trivy-image.json
            dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
