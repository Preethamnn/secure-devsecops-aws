
name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Source and Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DevSecOps repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Juice Shop source
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          ref: v20.3.0
          path: juice-shop

      - name: Scan source for misconfigurations and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: juice-shop
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-source.json
          exit-code: '0'

      - name: Build Juice Shop Docker image
        run: docker build -t juice-shop:ci ./juice-shop

     
      - name: Inspect Juice Shop image filesystem
        continue-on-error: true
        run: |
          set -eu

          container_id=$(docker create juice-shop:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          mkdir -p image-rootfs
          docker export "$container_id" | tar -xf - -C image-rootfs

          echo "Checking package manifests and installed dependency locations:"
          find image-rootfs -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name yarn.lock -o \
            -name pnpm-lock.yaml \
          \) -print > dependency-tree.json

          cat dependency-tree.json



      - name: Report vulnerable package versions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock = Path("image-rootfs/juice-shop/package-lock.json")
          targets = {
              "crypto-js", "handlebars", "jsonwebtoken",
              "lodash", "tar", "moment"
          }

          if not lock.exists():
              print("ERROR: package-lock.json not found")
              raise SystemExit(1)

          data = json.loads(lock.read_text(encoding="utf-8"))
          packages = data.get("packages", {})

          print("Package-lock version:", data.get("lockfileVersion"))
          print("\nInstalled dependency locations:")

          found = 0
          for path, info in sorted(packages.items()):
              if not path:
                  continue

              name = path.rsplit("node_modules/", 1)[-1]
              if name in targets:
                  print(f"{name:15} {info.get('version', 'unknown'):12} {path}")
                  found += 1

          if found == 0:
              print("No target packages found in package-lock.json")
          PY



      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop:ci
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: '0'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-source.json
            trivy-image.json
            dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
